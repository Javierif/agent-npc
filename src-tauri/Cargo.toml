[package]
name = "claude-npc"
version = "0.1.0"
description = "A desktop NPC that delegates tasks to Claude Code"
authors = ["Javier"]
license = "MIT"
edition = "2024"
default-run = "claude-npc"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_npc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-npc"
path = "src/main.rs"

[[bin]]
name = "npc-bridge"
path = "src/bin/npc-bridge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
getrandom = "0.3"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
